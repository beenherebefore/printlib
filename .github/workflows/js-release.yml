name: JS Release to CDN

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install terser
        run: npm install -g terser

      - name: Create dist directory
        run: mkdir -p dist

      - name: Copy unminified JS
        run: cp js/printlib.js dist/printlib.js

      - name: Minify JS
        run: terser js/printlib.js -o dist/printlib.min.js --compress --mangle

      - name: Verify files
        run: |
          echo "Unminified: $(wc -c < dist/printlib.js) bytes"
          echo "Minified: $(wc -c < dist/printlib.min.js) bytes"

      - name: Commit dist to CDN branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "chore: update dist for ${{ github.ref_name }}"
          # Push dist/ to a dedicated cdn branch (not the tag)
          git branch -f cdn
          git push origin cdn --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/printlib.js
            dist/printlib.min.js
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
